applications:
  - appRoot: Bzeadstore-main
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: X-Frame-Options
            value: DENY
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-XSS-Protection
            value: '1; mode=block'
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: 'geolocation=(self), microphone=(), camera=(self), payment=()'
          - key: Strict-Transport-Security
            value: 'max-age=31536000; includeSubDomains; preload'
          - key: Content-Security-Policy
            value: >-
              default-src 'self';
              script-src 'self' https://js.stripe.com;
              style-src 'self' 'unsafe-inline';
              img-src 'self' data: blob: https:;
              font-src 'self' data:;
              connect-src 'self' https://api.stripe.com https://*.supabase.co wss://*.supabase.co https://open.er-api.com https://nominatim.openstreetmap.org;
              media-src 'self' https://*.supabase.co data: blob:;
              frame-src https://js.stripe.com https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com;
              object-src 'none';
              base-uri 'self';
              form-action 'self'

      # Proxied edge-function responses — Amplify rewrites Content-Type to text/plain;
      # override it so browsers parse the HTML properly
      - pattern: '/share/*'
        headers:
          - key: Content-Type
            value: 'text/html; charset=utf-8'

      - pattern: '/products/**'
        headers:
          - key: Content-Type
            value: 'text/html; charset=utf-8'

      - pattern: '/'
        headers:
          - key: Cache-Control
            value: 'no-store, no-cache, must-revalidate, proxy-revalidate'
          - key: Pragma
            value: 'no-cache'
          - key: Expires
            value: '0'

      - pattern: '*.html'
        headers:
          - key: Cache-Control
            value: 'no-store, no-cache, must-revalidate, proxy-revalidate'
          - key: Pragma
            value: 'no-cache'
          - key: Expires
            value: '0'

      - pattern: '/assets/*'
        headers:
          - key: Cache-Control
            value: 'public, max-age=31536000, immutable'

      - pattern: '/images/*'
        headers:
          - key: Cache-Control
            value: 'public, max-age=31536000, immutable'

      - pattern: '*.woff2'
        headers:
          - key: Cache-Control
            value: 'public, max-age=31536000, immutable'

      - pattern: '*.woff'
        headers:
          - key: Cache-Control
            value: 'public, max-age=31536000, immutable'
