# Cloudflare Worker configuration for BZEAD
name = "bzead"
main = "worker.js"
compatibility_date = "2026-08-12"

# Static assets produced by `npm run build`
[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Dashboard settings (when using Cloudflare Workers Git integration):
#   - Root directory: Bzeadstore-main
#   - Build command:  npm ci && npm run build
#   - Deploy command: npx wrangler deploy
#
# Required build environment variables (add in Cloudflare dashboard):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#   VITE_STRIPE_PUBLISHABLE_KEY
#   VITE_ONESIGNAL_APP_ID
#   VITE_DOMAIN
#   VITE_PUBLIC_APP_URL
#   VITE_ENVIRONMENT
#
# Optional frontend variables:
#   VITE_ADSENSE_CLIENT
#   VITE_ADSENSE_SLOT_HOME_FOOTER
#
# Optional download redirect (AAB/APK files exceed Workers asset size limit):
#   DOWNLOAD_BASE_URL  (e.g. https://pub-xxx.r2.dev or https://storage.bzead.com)
# ---------------------------------------------------------------------------
